<style>
:root{--b:#19bfff;--ink:#eaf6ff;--bg:#060b13;--pn:rgba(9,17,29,.84);--ln:rgba(140,200,255,.16);--mut:#8aa0b4}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
#map{position:absolute;inset:0}
.glass{background:var(--pn);border:1px solid var(--ln);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 36px #0007}

.row{display:flex;align-items:center;gap:10px;padding:0 14px}

.dot{width:10px;height:10px;border-radius:50%;flex:none;border:2.5px solid var(--b)}.dot.d{background:var(--b)}

.compass{width:48px;height:48px;border-radius:50%;flex:none;display:block}.compass svg{width:100%;height:100%;display:block}
#banner{display:none;border-radius:20px;padding:12px 18px;align-items:center;gap:14px}

#bD{font-size:26px;font-weight:800;color:var(--b);line-height:1.1}#bS{font-size:12px;color:#aebfce;margin-top:2px}

.sum{margin-bottom:12px}.sum small{font-size:11px;color:var(--mut)}

#hClk{font-size:clamp(20px,6vmin,40px);font-weight:700}

#hSt{font-size:clamp(14px,4vmin,28px);font-weight:600}
.w[data-k=compass]{width:clamp(44px,11vmin,64px);height:clamp(44px,11vmin,64px);padding:0;border-radius:50%}
.w[data-k=compass] svg{width:100%;height:100%;display:block}
#hbar{position:absolute;z-index:25;bottom:3%;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:7px;border-radius:18px;transition:opacity .4s}

.panel{position:absolute;z-index:28;bottom:calc(3% + 62px);left:50%;transform:translateX(-50%);width:min(92%,460px);max-height:62%;overflow:auto;border-radius:20px;padding:14px;display:none;font-size:13px}
.panel.show{display:block}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #ffffff0d}
.fr input[type=range]{width:55%;accent-color:var(--b)}.fr input[type=color]{width:46px;height:28px;border:0;background:none;padding:0}
.fr select{background:#0b1a2b;border:1px solid var(--ln);border-radius:8px;padding:4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}

.wrow{border-bottom:1px solid #ffffff12;padding:6px 0}.wrow.open{background:#19bfff0d;border-radius:10px;padding:6px 8px}.wh{display:flex;justify-content:space-between;align-items:center;font-weight:600;padding:4px 0}.wh input{width:20px;height:20px;accent-color:var(--b)}
.pn-h{font-weight:700;margin-bottom:8px;color:var(--b)}
.rs{display:block;width:100%;margin-top:10px;padding:10px;border-radius:12px;border:1px solid #ff536455;color:#ff8791}

/* ---------- v2 design refinements ---------- */
:root{--pn:linear-gradient(180deg,rgba(15,28,45,.92),rgba(8,15,26,.88))}
.glass{box-shadow:0 14px 40px #0009,inset 0 1px 0 #ffffff14;border-color:rgba(140,200,255,.2)}
#hdr{left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px)}
.row input{font-size:16px}
.ib,.controls button,#hbar button{min-height:44px;min-width:44px}
#res div{min-height:48px;display:flex;flex-direction:column;justify-content:center}
#res .none{color:var(--mut);text-align:center}
#sheet::before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:#ffffff30;margin:-6px auto 12px}
.pbtn,.sbtn,.ib,.controls button,.fab{transition:transform .12s,filter .12s}
.pbtn:active,.sbtn:active,.ib:active,.controls button:active,.fab:active{transform:scale(.95)}
.pbtn{box-shadow:0 6px 20px #0a7cff55}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
#rec{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 10px;scrollbar-width:none;border-top:1px solid #ffffff10}#rec:empty{display:none}
#rec button{flex:none;padding:8px 13px;border-radius:12px;border:1px solid var(--ln);background:#ffffff0a;font-size:12px}#rec .z{color:#ff8791}
#fabs{position:absolute;z-index:5;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 206px);display:flex;flex-direction:column;gap:10px}
.fab{width:46px;height:46px;border-radius:50%;font-size:19px;color:var(--b)}.fab.on{background:#19bfff30;border-color:var(--b)}
#net{position:fixed;z-index:70;left:50%;top:calc(env(safe-area-inset-top,0px) + 2px);transform:translateX(-50%);padding:5px 14px;border-radius:0 0 12px 12px;font-size:11px;color:#ffb36b;display:none;white-space:nowrap}#net.show{display:block}
@media (max-height:480px) and (orientation:landscape){#fabs{bottom:90px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const CFG={MAP_KEY:'web.292eb260630440859776333b3d9f72a1',SERVICE_KEY:'service.399ca876d2b84549b70a2043cb6bb583',TEHRAN:[51.389,35.6892]};
const $=s=>document.querySelector(s),fa=x=>String(x).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]).replace('.','٫');
const rad=Math.PI/180,R=6371000,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let map,hudMap,meMk,orgMk,dstMk,route=null,origin=null,dst=null,gps=null,cp=null,lastFix=null,lastRR=0;
let navOn=false,hudOpen=false,wid=null,muted=false,idx=0,off=0,spoken={},hd=0,spd=0,wake=null,active='d',rerouting=false,follow=true;

/* ---------- Settings ---------- */
const WLIST={turn:'مانور بعدی',speed:'سرعت',clock:'ساعت',eta:'زمان و مسافت',street:'نام خیابان',compass:'قطب‌نما'};
const DEF={rc:'#19bfff',wc:'#19bfff',rw:9,rg:.4,st:.35,p:50,z:18,cy:72,car:'arrow',u:'kmh',h24:true,lim:0,mirror:false,
 w:{turn:{on:1,x:16,y:20,s:1,o:1,b:1},speed:{on:1,x:87,y:26,s:1,o:1,b:1},clock:{on:1,x:50,y:9,s:1,o:1,b:1},eta:{on:1,x:17,y:86,s:1,o:1,b:1},street:{on:1,x:50,y:92,s:1,o:.9,b:1},compass:{on:1,x:93,y:84,s:.8,o:1,b:1}}};
let cfg=JSON.parse(JSON.stringify(DEF));
try{const s=JSON.parse(localStorage.getItem('hudcfg2')||'null');if(s){Object.assign(cfg,s);cfg.w=Object.assign({},DEF.w,s.w||{});for(const k in DEF.w)cfg.w[k]=Object.assign({},DEF.w[k],cfg.w[k])}}catch(e){}
const save=()=>{try{localStorage.setItem('hudcfg2',JSON.stringify(cfg))}catch(e){}};
const F=[['rc','رنگ مسیر','color'],['wc','رنگ ویجت‌ها','color'],['rw','ضخامت مسیر','range',3,18,1],['rg','درخشش مسیر','range',0,1,.05],['st','پررنگی خیابان‌های اطراف','range',0,1,.05],['p','زاویهٔ دوربین','range',0,70,1],['z','زوم نقشه','range',15,19.5,.1],['cy','جای ماشین روی صفحه','range',45,92,1],['car','نشانگر ماشین','sel',[['arrow','پیکان'],['dot','نقطه']]],['u','واحد سرعت','sel',[['kmh','km/h'],['mph','mph']]],['h24','ساعت ۲۴ ساعته','chk'],['lim','هشدار سرعت (۰ = خاموش)','range',0,200,5]];

/* ---------- Helpers ---------- */
const hav=(a,b)=>{const x=Math.sin((b[1]-a[1])*rad/2)**2+Math.cos(a[1]*rad)*Math.cos(b[1]*rad)*Math.sin((b[0]-a[0])*rad/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const brg=(a,b)=>{const dl=(b[0]-a[0])*rad,y=Math.sin(dl)*Math.cos(b[1]*rad),x=Math.cos(a[1]*rad)*Math.sin(b[1]*rad)-Math.sin(a[1]*rad)*Math.cos(b[1]*rad)*Math.cos(dl);return(Math.atan2(y,x)/rad+360)%360};
function dec(s){let i=0,la=0,lo=0,o=[];while(i<s.length){for(let k=0;k<2;k++){let r=0,sh=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);const d=(r&1)?~(r>>1):r>>1;k?lo+=d:la+=d}o.push([lo/1e5,la/1e5])}return o}
function toast(t){const h=hudOpen,e=$(h?'#hToast':'#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2600)}
const fd=m=>m<1000?fa(Math.max(0,Math.round(m/10)*10))+' متر':fa((m/1000).toFixed(1))+' کیلومتر';
const fm=s=>{const m=Math.max(1,Math.round(s/60));return m<60?fa(m)+' دقیقه':fa(Math.floor(m/60))+' ساعت و '+fa(m%60)+' دقیقه'};
function ico(m,t){m=(m||'').toLowerCase();let p,tr='';if(t==='arrive')p='M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12zm0-9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z';else if(/roundabout|rotary/.test(t||''))p='M12 3a9 9 0 1 0 9 9h-3a6 6 0 1 1-6-6V3zM12 1l5 4-5 4z';else if(m==='uturn')p='M7 21V9a5 5 0 0 1 10 0v6h3l-5 6-5-6h3V9a1 1 0 0 0-2 0v12z';else if(m==='left'||m==='right'){p='M6 21V13a4 4 0 0 1 4-4h5V6l5.5 5.5L15 17v-3h-5v7z';if(m==='left')tr='transform:scaleX(-1)'}else{p='M12 3l7 8h-4.5v10h-5V11H5z';const a={'slight right':35,'slight left':-35,'sharp right':135,'sharp left':-135}[m];if(a)tr='transform:rotate('+a+'deg)'}return '<svg viewBox="0 0 24 24" fill="currentColor" style="'+tr+'"><path d="'+p+'"/></svg>'}

function apply(){const h=$('#hud');h.style.setProperty('--b',cfg.wc);h.style.setProperty('--rc',cfg.rc);
 $('#car').style.top=cfg.cy+'%';$('#car').innerHTML=cfg.car==='dot'?'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="12" fill="'+cfg.rc+'" stroke="#e6f8ff" stroke-width="3"/></svg>':'<svg viewBox="0 0 48 48"><path d="M24 3l17 40-17-10L7 43z" fill="'+cfg.rc+'" stroke="#e6f8ff" stroke-width="2" stroke-linejoin="round"/></svg>';
 $('#hU').textContent=cfg.u==='mph'?'mph':'km/h';$('#hudView').classList.toggle('mirror',cfg.mirror);$('#hMir').classList.toggle('on',cfg.mirror);
 styleRoute(map,'main');styleRoute(hudMap,'hud');if(hudMap){dimHud();hcam(cp||(route&&route.pts[0])||CFG.TEHRAN,300)}tick()}
function tick(){$('#hClk').textContent=new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit',hour12:!cfg.h24})}setInterval(tick,5000);

/* ---------- HUD open / close ---------- */
let barT;function wake_bar(){const b=$('#hbar');b.classList.remove('idle');clearTimeout(barT);if(!edit&&!$('#pSet').classList.contains('show'))barT=setTimeout(()=>b.classList.add('idle'),5000)}
$('#hud').addEventListener('pointerdown',e=>{if(!e.target.closest('.panel')&&!e.target.closest('.w'))wake_bar()});
function hudFit(){const h=$('#hud');if(rot()){h.style.inset='auto';h.style.top='0';h.style.left='0';h.style.width=innerHeight+'px';h.style.height=innerWidth+'px';h.style.transformOrigin='0 0';h.style.transform='translateX('+innerWidth+'px) rotate(90deg)'}
 else{h.style.inset='0';h.style.width=h.style.height=h.style.transform=h.style.transformOrigin=h.style.top=h.style.left=''}
 setTimeout(()=>{if(hudMap){hudMap.resize();hcam(cp||route.pts[0],0)}},80)}
function hud(on){const el=$('#hud');
 if(!on){if(!hudOpen)return;setEdit(false);$('#pSet').classList.remove('show');hudOpen=false;el.style.display='none';try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()}catch(e){}
  if(navOn&&cp){showMe(cp);map.jumpTo({center:cp,bearing:hd,zoom:17,pitch:58})}return}
 if(!route){toast('ابتدا یک مسیر انتخاب کنید');return}
 hudOpen=true;el.style.display='block';hudFit();syncForm();for(const k in WH)place(k);apply();wake_bar();
 if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().then(()=>{try{return screen.orientation.lock('landscape')}catch(e){}}).catch(()=>{});
 requestAnimationFrame(()=>{const c=cp||route.pts[0];
  if(!hudMap){try{hudMap=mkMap('hudMap',{zoom:cfg.z,pitch:cfg.p,bearing:hd,center:c,interactive:false});
   hudMap.on('rotate',()=>setCompass(hudMap.getBearing()));
   hudMap.once('load',()=>{dimHud();drawRoute(hudMap,'hud',route?route.pts:[]);hudMap.once('idle',dimHud);hcam(cp||c,0)})}catch(e){toast('ساخت نقشهٔ HUD ناموفق بود')}}
  else{hudMap.resize();whenReady(hudMap,()=>drawRoute(hudMap,'hud',route.pts));hcam(c,0)}})}
$('#hLoc').onclick=()=>getPos(c=>{gps=c;if(!navOn||!cp)cp=c;hcam(cp,700);toast('موقعیت شما پیدا شد')});
$('#hMir').onclick=()=>{cfg.mirror=!cfg.mirror;save();apply()};
$('#hFs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
$('#hudClose').onclick=()=>hud(false);

/* ---------- Buttons / lifecycle ---------- */
$('#go').onclick=()=>startNav();$('#recenterBtn').onclick=refollow;$('#xB').onclick=stopNav;$('#hB').onclick=()=>hud(true);$('#hB2').onclick=()=>{if(!navOn)startNav();hud(true)};$('#clearRoute').onclick=clearRoute;
$('#vB').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊';toast(muted?'راهنمای صوتی خاموش شد':'راهنمای صوتی روشن شد')};
addEventListener('pagehide',saveState);addEventListener('resize',()=>{if(hudOpen)hudFit();else if(hudMap)hudMap.resize()});addEventListener('orientationchange',()=>setTimeout(()=>{if(hudOpen)hudFit()},200));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&navOn){wake=null;lockScreen();if(hudMap)hudMap.resize()}});
try{const st=JSON.parse(localStorage.getItem('hudmap-state')||'null');
 if(st&&st.pts&&st.pts.length>1&&Date.now()-st.t<86400000){origin=st.o;dst=st.d;
  if(origin){orgMk=marker('marker-org');orgMk.setLngLat(origin).addTo(map);$('#qo').value='مبدا ذخیره‌شده'}
  if(dst){dstMk=marker('marker-dest');dstMk.setLngLat(dst).addTo(map);$('#qd').value='مقصد ذخیره‌شده'}
  build({pts:st.pts,dur:st.dur,steps:st.steps});if(st.nav&&confirm('ادامهٔ مسیریابی قبلی؟'))startNav()}
 else{if(st)clearState();getPos(c=>{showMe(c);map.jumpTo({center:c,zoom:14})},true)}}catch(e){}
mark();tick();

/* ================= v2 enhancements ================= */
(function(){
const LS=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
[['gpsO','موقعیت من به‌عنوان مبدا'],['clrO','پاک کردن مبدا'],['clrD','پاک کردن مقصد'],['locBtn','موقعیت من'],['compass','قطب‌نما'],['vB','راهنمای صوتی'],['hB','HUD'],['xB','پایان مسیریابی'],['hudClose','خروج از HUD'],['hLoc','موقعیت من'],['hSet','تنظیمات'],['hFs','تمام‌صفحه']].forEach(([i,l])=>{const e=document.getElementById(i);e&&e.setAttribute('aria-label',l)});
let wg=0;window.weakGps=()=>{if(Date.now()-wg>8000){wg=Date.now();toast('دقت GPS پایین است؛ منتظر سیگنال بهتر…')}};

/* search: cancels stale requests, shows empty/error states, Enter picks first */
let ctl=null,seq=0;
window.search=async function(v,kind){ctl&&ctl.abort();ctl=new AbortController();const my=++seq,box=$('#res');$('#rec').innerHTML='';
 try{const c=map.getCenter(),r=await fetch('https://api.neshan.org/v1/search?term='+encodeURIComponent(v)+'&lat='+c.lat+'&lng='+c.lng,{headers:{'Api-Key':CFG.SERVICE_KEY},signal:ctl.signal});
  if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(my!==seq)return;
  box.innerHTML='';const items=(j.items||[]).slice(0,7);
  if(!items.length){const d=document.createElement('div');d.className='none';d.textContent='نتیجه‌ای پیدا نشد؛ عبارت دیگری بنویسید';box.appendChild(d);return}
  items.forEach(it=>{const l=it.location||{},p=[l.x,l.y],d=document.createElement('div'),a=document.createElement('span'),s=document.createElement('small');
   a.textContent=it.title||'';s.textContent=[it.region,it.address].filter(Boolean).join(' · ');d.append(a,s);
   d.onclick=()=>{box.innerHTML='';kind==='o'?setOrigin(p,it.title):setDest(p,it.title);map.flyTo({center:p,zoom:15,speed:1.4})};box.appendChild(d)})
 }catch(e){if(e.name==='AbortError')return;toast('جستجو ناموفق بود؛ اتصال یا کلید API را بررسی کنید')}};
['#qo','#qd'].forEach(s=>$(s).addEventListener('keydown',e=>{if(e.key==='Enter'){const f=$('#res div:not(.none)');f&&f.click();e.target.blur()}}));

/* recent destinations */
const getR=()=>LS('hud-recent')||[];
function addRecent(p,l){if(!l||!p)return;const r=getR().filter(x=>hav(x.p,p)>150);r.unshift({l,p});LS('hud-recent',r.slice(0,6))}
function showRec(){const b=$('#rec'),r=getR();b.innerHTML='';if(!r.length||navOn)return;
 r.forEach(x=>{const c=document.createElement('button');c.textContent=x.l;c.onclick=()=>{b.innerHTML='';active==='o'?setOrigin(x.p,x.l):setDest(x.p,x.l);map.flyTo({center:x.p,zoom:14})};b.appendChild(c)});
 const z=document.createElement('button');z.className='z';z.textContent='پاک‌کردن';z.onclick=()=>{LS('hud-recent',[]);b.innerHTML=''};b.appendChild(z)}
['#qo','#qd'].forEach(s=>{$(s).addEventListener('focus',()=>{if(!$(s).value)showRec()});$(s).addEventListener('input',()=>{$('#rec').innerHTML=''})});
const _sd=window.setDest;
window.setDest=function(p,l){_sd(p,l);if(l&&!/انتخاب‌شده|ذخیره‌شده/.test(l))addRecent(p,l);$('#rec').innerHTML=''};

/* voice: picks a Persian voice, falls back to beep + vibration + toast */
let fv=null,warned=false,au=null;
const pv=()=>{try{fv=speechSynthesis.getVoices().find(v=>/^fa/i.test(v.lang))||null}catch(e){}};
if(window.speechSynthesis){pv();speechSynthesis.onvoiceschanged=pv}
function beep(){try{au=au||new(window.AudioContext||window.webkitAudioContext)();const o=au.createOscillator(),g=au.createGain();o.connect(g);g.connect(au.destination);o.frequency.value=880;g.gain.setValueAtTime(.15,au.currentTime);g.gain.exponentialRampToValueAtTime(.001,au.currentTime+.25);o.start();o.stop(au.currentTime+.26)}catch(e){}}
window.say=function(t){if(muted)return;try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
 if(!window.speechSynthesis||!fv){beep();if(!warned){warned=true;toast('صدای فارسی روی این دستگاه نصب نیست؛ هشدار بصری و بوق فعال است')}return}
 const u=new SpeechSynthesisUtterance(t);u.lang='fa-IR';u.voice=fv;speechSynthesis.cancel();speechSynthesis.speak(u)};

/* traffic + day/night */
let tr=false,day=false;
$('#trBtn').onclick=e=>{tr=!tr;try{map.setTraffic(tr);hudMap&&hudMap.setTraffic(tr);e.currentTarget.classList.toggle('on',tr);toast(tr?'ترافیک روشن شد':'ترافیک خاموش شد')}catch(x){tr=!tr;toast('ترافیک در این نسخهٔ SDK پشتیبانی نمی‌شود')}};
$('#stBtn').onclick=e=>{day=!day;try{const T=nmp_mapboxgl.Map.mapTypes;map.setMapType(day?T.neshanVector:T.neshanVectorNight);e.currentTarget.classList.toggle('on',day);
 const re=()=>{try{route&&drawRoute(map,'main',route.pts)}catch(x){}};map.once('style.load',re);whenReady(map,re)}catch(x){day=!day;toast('تغییر سبک نقشه ممکن نشد')}};

/* network + service worker */
const net=$('#net'),nu=()=>net.classList.toggle('show',!navigator.onLine);
addEventListener('online',()=>{nu();toast('اتصال برقرار شد')});addEventListener('offline',nu);nu();
addEventListener('unhandledrejection',e=>console.warn('unhandled',e.reason));
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
