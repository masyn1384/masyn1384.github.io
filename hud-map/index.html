<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080c">
<title>مسیریاب HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://static.neshan.org/sdk/mapboxgl/v1.13.2/neshan-sdk/v1.0.8/index.css">
<script src="https://static.neshan.org/sdk/mapboxgl/v1.13.2/neshan-sdk/v1.0.8/index.js"></script>
<style>
:root{--gold:#d9b36c;--gold2:linear-gradient(135deg,#f3dda6,#b98d3e);--cy:#37f2ff;--glass:rgba(14,16,22,.78);--ink:#f4efe6;--mut:#9a968c;--bd:rgba(217,179,108,.28)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07080c;color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;overflow:hidden}
#map{position:absolute;inset:0}
.g{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:22px;box-shadow:0 10px 40px #000a}
.gb{border:0;background:var(--gold2);color:#1a1409;font:800 16px Vazirmatn,Tahoma,sans-serif;border-radius:16px;padding:14px;cursor:pointer;width:100%}
.ob{border:1px solid var(--bd);background:transparent;color:var(--gold);font:500 14px Vazirmatn,Tahoma,sans-serif;border-radius:14px;padding:12px;cursor:pointer;width:100%}
#top{position:absolute;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline:12px}
#q{width:100%;background:none;border:0;outline:0;color:var(--ink);font:500 15px Vazirmatn,Tahoma,sans-serif;padding:15px 18px}
#res{max-height:34vh;overflow:auto}
#res div{padding:11px 18px;border-top:1px solid var(--bd);font-size:14px;cursor:pointer}#res small{display:block;color:var(--mut);font-size:12px}
#sheet{position:absolute;z-index:5;inset-inline:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:18px;display:none}
#sheet .sum{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}#sheet b{font-size:30px;color:var(--gold)}#sheet span{color:var(--mut)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
#banner{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);inset-inline:12px;padding:14px 18px;display:none;align-items:center;gap:16px}
#banner svg{width:52px;height:52px;color:var(--gold);flex:none}#bD{font-size:30px;font-weight:800}#bS{font-size:14px;color:var(--mut)}
#bar{position:absolute;z-index:6;inset-inline:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:14px 18px;display:none;align-items:center;justify-content:space-between;gap:10px}
#bar .eta{font-size:24px;font-weight:800;color:var(--gold)}#bar small{display:block;color:var(--mut);font-size:12px}
.cb{display:flex;gap:8px}.cb button{width:46px;height:46px;border-radius:14px;border:1px solid var(--bd);background:#ffffff0d;color:var(--ink);font-size:18px;cursor:pointer}.cb .x{background:#c23b3b;border:0}
#toast{position:fixed;z-index:30;top:90px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:20px;background:var(--glass);border:1px solid var(--bd);font-size:13px;opacity:0;transition:.3s;pointer-events:none}
.pin{width:20px;height:20px;border-radius:50%;background:#e5484d;border:3px solid #fff;box-shadow:0 0 14px #e5484d}
.me{width:22px;height:22px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 8px #d9b36c44}
/* HUD */
#hud{position:fixed;inset:0;z-index:20;background:#000;display:none;overflow:hidden}
#hudView{position:absolute;inset:0;transition:transform .3s}#hudView.flip{transform:scaleX(-1)}
#hudMap{position:absolute;inset:0;transform:perspective(520px) rotateX(36deg) scale(1.15);transform-origin:50% 90%}
#cv{width:100%;height:100%;display:block}
.hl{position:absolute;left:5vmin;top:5vmin;max-width:55%;color:#dffbff;direction:rtl;text-shadow:0 0 12px #37f2ff88}
.hst{font-size:clamp(18px,4.6vmin,34px);font-weight:500;margin-bottom:1.6vmin}
.hrow{display:flex;align-items:center;gap:2vmin;font-size:clamp(26px,7vmin,56px);font-weight:800;line-height:1.15}
.hrow svg{width:clamp(30px,8vmin,64px);height:clamp(30px,8vmin,64px);fill:currentColor;flex:none}
.hrow.t{font-size:clamp(18px,4.6vmin,36px);font-weight:500;opacity:.85}.hrow.t svg{fill:none;stroke:currentColor;stroke-width:2;width:clamp(22px,5vmin,40px);height:clamp(22px,5vmin,40px)}
.hr{position:absolute;right:5vmin;top:4vmin;width:clamp(86px,19vmin,150px);aspect-ratio:1;text-align:center;color:#dffbff;display:grid;place-items:center}
.hr svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(135deg)}
.hr b{font-size:clamp(28px,8vmin,60px);font-weight:800;line-height:1;display:block;text-shadow:0 0 14px #37f2ff99}.hr small{font-size:clamp(10px,2.4vmin,16px);opacity:.7}
#hudCtl{position:absolute;inset-inline:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:center;gap:12px;opacity:.35}
#hudCtl button{background:#111;color:#fff;border:1px solid #444;border-radius:20px;padding:8px 18px;font:500 13px Vazirmatn,Tahoma,sans-serif}
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="g"><input id="q" placeholder="جستجوی مقصد یا ضربه روی نقشه…" autocomplete="off"><div id="res"></div></div>
<div id="sheet" class="g"><div class="sum"><b id="sT">—</b><span id="sD">—</span></div>
 <div class="two"><button class="gb" id="go">شروع مسیریابی</button><button class="ob" id="simB">شبیه‌سازی</button></div></div>
<div id="banner" class="g"><span id="bI"></span><div><div id="bD">—</div><div id="bS">—</div></div></div>
<div id="bar" class="g"><div><div class="eta" id="eta">—</div><small id="rem">—</small></div>
 <div class="cb"><button id="hB" title="HUD">HUD</button><button class="x" id="xB">✕</button></div></div>
<div id="toast"></div>

<div id="hud"><div id="hudView">
 <div id="hudMap"><canvas id="cv"></canvas></div>
 <div class="hl"><div class="hst" id="hSt">—</div>
  <div class="hrow"><span id="hI"></span><span id="hD">—</span></div>
  <div class="hrow t"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span id="hT">—</span></div></div>
 <div class="hr"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#37f2ff33" stroke-width="5" stroke-dasharray="207 276" stroke-linecap="round"/><circle id="ring" cx="50" cy="50" r="44" fill="none" stroke="#37f2ff" stroke-width="5" stroke-dasharray="0 276" stroke-linecap="round" style="filter:drop-shadow(0 0 5px #37f2ff)"/></svg><div><b id="hS">۰</b><small>km/h</small></div></div>
</div>
<div id="hudCtl"><button id="mir">آینه</button><button id="hX">خروج</button></div></div>

<script>
/* ====== تنظیمات / کلیدها ====== */
const CFG={MAP_KEY:'web.292eb260630440859776333b3d9f72a1',SERVICE_KEY:'service.399ca876d2b84549b70a2043cb6bb583',DEFAULT:[51.58,30.67]};

const $=s=>document.querySelector(s),fa=x=>String(x).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]).replace('.','٫');
const rad=Math.PI/180,R=6371000;
let map,meMk,dstMk,route,pos=null,navOn=false,sim=null,wid=null,idx=0,off=0,hd=0,spd=0,dst=null;
const hav=(a,b)=>{const x=Math.sin((b[1]-a[1])*rad/2)**2+Math.cos(a[1]*rad)*Math.cos(b[1]*rad)*Math.sin((b[0]-a[0])*rad/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const brg=(a,b)=>{const dl=(b[0]-a[0])*rad,y=Math.sin(dl)*Math.cos(b[1]*rad),x=Math.cos(a[1]*rad)*Math.sin(b[1]*rad)-Math.sin(a[1]*rad)*Math.cos(b[1]*rad)*Math.cos(dl);return(Math.atan2(y,x)/rad+360)%360};
function dec(s){let i=0,la=0,lo=0,o=[];while(i<s.length){for(let k=0;k<2;k++){let r=0,sh=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);const d=(r&1)?~(r>>1):r>>1;k?lo+=d:la+=d}o.push([lo/1e5,la/1e5])}return o}
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2600)}
const fd=m=>m<1000?fa(Math.max(0,Math.round(m/10)*10))+' متر':fa((m/1000).toFixed(1))+' کیلومتر';
const fm=s=>{const m=Math.max(1,Math.round(s/60));return m<60?fa(m)+' دقیقه':fa(Math.floor(m/60))+' ساعت و '+fa(m%60)+' دقیقه'};

/* آیکن پیچ‌ها */
function ico(m,t){m=(m||'').toLowerCase();let p,tr='';
 if(t==='arrive')p='M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12zm0-9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z';
 else if(/roundabout|rotary/.test(t||''))p='M12 3a9 9 0 1 0 9 9h-3a6 6 0 1 1-6-6V3zM12 1l5 4-5 4z';
 else if(m==='uturn')p='M7 21V9a5 5 0 0 1 10 0v6h3l-5 6-5-6h3V9a1 1 0 0 0-2 0v12z';
 else if(m==='left'||m==='right'){p='M6 21V13a4 4 0 0 1 4-4h5V6l5.5 5.5L15 17v-3h-5v7z';if(m==='left')tr='transform:scaleX(-1)'}
 else{p='M12 3l7 8h-4.5v10h-5V11H5z';const a={'slight right':35,'slight left':-35,'sharp right':135,'sharp left':-135}[m];if(a)tr='transform:rotate('+a+'deg)'}
 return '<svg viewBox="0 0 24 24" fill="currentColor" style="'+tr+'"><path d="'+p+'"/></svg>'}

/* نقشه */
try{map=new nmp_mapboxgl.Map({mapType:nmp_mapboxgl.Map.mapTypes.neshanVectorNight,container:'map',zoom:13,pitch:0,center:CFG.DEFAULT,minZoom:2,maxZoom:21,trackResize:true,mapKey:CFG.MAP_KEY,poi:true,traffic:false,mapTypeControl:false});
 const el=document.createElement('div');el.className='me';meMk=new nmp_mapboxgl.Marker({element:el}).setLngLat(CFG.DEFAULT).addTo(map);
 map.on('click',e=>setDest([e.lngLat.lng,e.lngLat.lat]))}catch(e){toast('بارگذاری نقشه نشان ممکن نشد')}
if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{pos=[p.coords.longitude,p.coords.latitude];meMk&&meMk.setLngLat(pos);map&&map.jumpTo({center:pos,zoom:14})},()=>{},{enableHighAccuracy:true});

/* جستجو */
let st;$('#q').oninput=e=>{clearTimeout(st);const v=e.target.value.trim();if(v.length<2){$('#res').innerHTML='';return}
 st=setTimeout(async()=>{try{const c=pos||CFG.DEFAULT,r=await fetch('https://api.neshan.org/v1/search?term='+encodeURIComponent(v)+'&lat='+c[1]+'&lng='+c[0],{headers:{'Api-Key':CFG.SERVICE_KEY}}),j=await r.json();
 $('#res').innerHTML='';(j.items||[]).slice(0,6).forEach(it=>{const d=document.createElement('div');d.innerHTML=it.title+'<small>'+(it.address||'')+'</small>';d.onclick=()=>{$('#res').innerHTML='';$('#q').value=it.title;const p=[it.location.x,it.location.y];map.flyTo({center:p,zoom:15});setDest(p)};$('#res').appendChild(d)})}catch(e){toast('جستجو ناموفق بود')}},350)};

/* مسیریابی */
async function setDest(d){if(navOn)return;dst=d;if(!dstMk){const el=document.createElement('div');el.className='pin';dstMk=new nmp_mapboxgl.Marker({element:el})}dstMk.setLngLat(d).addTo(map);
 const o=pos||CFG.DEFAULT;toast('در حال مسیریابی…');
 try{const r=await fetch('https://api.neshan.org/v4/direction?type=car&origin='+o[1]+','+o[0]+'&destination='+d[1]+','+d[0],{headers:{'Api-Key':CFG.SERVICE_KEY}}),j=await r.json();
  if(!j.routes||!j.routes[0])throw 0;const rt=j.routes[0],L=rt.legs[0];
  build({pts:dec(rt.overview_polyline.points),dur:L.duration.value,steps:L.steps});return true}
 catch(e){toast('دریافت مسیر ناموفق بود؛ اتصال اینترنت را بررسی کن');return false}}
function near(pts,p,a,b){let bi=a,bd=1e12;for(let i=a;i<Math.min(pts.length,b);i++){const d=(pts[i][0]-p[0])**2+(pts[i][1]-p[1])**2;if(d<bd){bd=d;bi=i}}return bi}
function build(o){const pts=o.pts,cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hav(pts[i-1],pts[i]));
 let sc=0;const steps=(o.steps||[]).map(s=>{const l=s.start_location;let sl=null;
  if(Array.isArray(l)&&isFinite(l[0])&&isFinite(l[1]))sl=l;
  else if(l&&typeof l==='object'){const x=l.x??l.lng??l.lon, y=l.y??l.lat; if(isFinite(x)&&isFinite(y))sl=[x,y];}
  sc+=(s.distance&&s.distance.value)||0;
  let ii=sl?near(pts,sl,0,pts.length):0;
  if(!sl){ii=cum.findIndex(v=>v>=sc);if(ii<0)ii=pts.length-1;}
  return{...s,i:ii}});
 if(!steps.length)steps.push({instruction:'ادامه دهید',modifier:'straight',name:'',i:pts.length-1});
 route={pts,cum,steps,total:cum[cum.length-1],dur:o.dur||cum[cum.length-1]/11};idx=0;off=0;
 const gj={type:'Feature',geometry:{type:'LineString',coordinates:pts}};
 if(map.getSource('route'))map.getSource('route').setData(gj);else{map.addSource('route',{type:'geojson',data:gj});
  map.addLayer({id:'rg',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#d9b36c','line-width':16,'line-opacity':.25,'line-blur':6}});
  map.addLayer({id:'rl',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#f3dda6','line-width':6}})}
 const b=new nmp_mapboxgl.LngLatBounds();pts.forEach(p=>b.extend(p));map.fitBounds(b,{padding:{top:130,bottom:240,left:40,right:40}});
 $('#sT').textContent=fm(route.dur);$('#sD').textContent=fd(route.total);if(!navOn)$('#sheet').style.display='block'}


/* ناوبری */

function startNav(simulate){if(!route){toast('اول مقصد را مشخص کن');return;}navOn=true;idx=0;$('#top').style.display=$('#sheet').style.display='none';$('#banner').style.display=$('#bar').style.display='flex';$('#bS').textContent='در انتظار سیگنال GPS…';$('#bD').textContent='—';
 navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});
 if(simulate){let dist=0;sim=setInterval(()=>{dist+=14*.5*(1+.2*Math.sin(dist/90));const c=route.cum;const i=c.findIndex(v=>v>=dist);if(i<1){stopNav();return}
  const f=(dist-c[i-1])/(c[i]-c[i-1]||1),a=route.pts[i-1],b=route.pts[i];fix([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f],14*3.6,brg(a,b))},500)}
 else if(navigator.geolocation)wid=navigator.geolocation.watchPosition(p=>fix([p.coords.longitude,p.coords.latitude],(p.coords.speed||0)*3.6,p.coords.heading),()=>toast('دسترسی به GPS ممکن نشد'),{enableHighAccuracy:true,maximumAge:500});
}
function fix(p,sp,h){pos=p;spd=sp||0;meMk.setLngLat(p);const pts=route.pts;idx=near(pts,p,idx,idx+250);
 if(hav(p,pts[idx])>70){if(++off>3&&!sim){off=0;toast('خارج از مسیر؛ مسیر جدید…');navOn=false;setDest(dst).then(ok=>{navOn=true;if(ok)idx=0})}}else off=0;
 hd=(h!=null&&!isNaN(h)&&sp>3)?h:brg(pts[idx],pts[Math.min(pts.length-1,idx+4)]);
 const rem=route.total-route.cum[idx],nx=route.steps.find(s=>s.i>idx)||route.steps[route.steps.length-1],dn=Math.max(0,route.cum[nx.i]-route.cum[idx]),sec=route.dur*rem/route.total;
 if(rem<25){toast('به مقصد رسیدید');return stopNav()}
 const modFromIns=(()=>{const t=nx.instruction||'';if(/دوربرگردان|دور بزن/.test(t))return'uturn';if(/میدان/.test(t))return'roundabout';if(/کمی به چپ|کمی چپ/.test(t))return'slight left';if(/کمی به راست|کمی راست/.test(t))return'slight right';if(/به چپ|سمت چپ/.test(t))return'left';if(/به راست|سمت راست/.test(t))return'right';if(/مستقیم/.test(t))return'straight';return nx.modifier||'straight'})();
 const isArr=/رسید/.test(nx.instruction||'')||nx.type==='arrive';
 const ic=ico(modFromIns,isArr?'arrive':''),txt=nx.instruction||'ادامه دهید';
 $('#bI').innerHTML=ic;$('#bD').textContent=fd(dn);$('#bS').textContent=txt+(nx.name?' · '+nx.name:'');
 $('#eta').textContent=fm(sec);$('#rem').textContent=fd(rem)+' · رسیدن '+new Date(Date.now()+sec*1000).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
 $('#hI').innerHTML=ic;$('#hD').textContent=fd(dn);$('#hSt').textContent=nx.name||txt;$('#hT').textContent=fm(sec);$('#hS').textContent=fa(Math.round(spd));
 $('#ring').setAttribute('stroke-dasharray',(Math.min(spd,160)/160*207)+' 276');

 if($('#hud').style.display==='block')draw();else map.easeTo({center:p,bearing:hd,zoom:17,pitch:60,duration:900,easing:t=>t,offset:[0,180]})}
function stopNav(){navOn=false;clearInterval(sim);sim=null;wid!=null&&navigator.geolocation.clearWatch(wid);wid=null;hud(false);
 $('#banner').style.display=$('#bar').style.display='none';$('#top').style.display='block';$('#sheet').style.display=route?'block':'none';map.easeTo({pitch:0,bearing:0,zoom:14,duration:800})}

/* HUD */
const cv=$('#cv'),cx=cv.getContext('2d');
function hud(on){$('#hud').style.display=on?'block':'none';if(on){size();draw();document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}else document.fullscreenElement&&document.exitFullscreen()}
function size(){const r=devicePixelRatio||1;cv.width=cv.clientWidth*r;cv.height=cv.clientHeight*r}
function draw(){if(!route||!pos)return;const W=cv.width,H=cv.height,k=H*.75/380,b=hd*rad,c=Math.cos(pos[1]*rad);cx.clearRect(0,0,W,H);
 const X=W/2,Y=H*.82,P=q=>{const dx=(q[0]-pos[0])*c*111320,dy=(q[1]-pos[1])*110540;return[X+(dx*Math.cos(b)-dy*Math.sin(b))*k,Y-(dx*Math.sin(b)+dy*Math.cos(b))*k]};
 cx.strokeStyle='#37f2ff1c';cx.lineWidth=2;for(let i=1;i<=5;i++){cx.beginPath();cx.arc(X,Y,i*H*.16,0,7);cx.stroke()}
 cx.lineCap=cx.lineJoin='round';cx.beginPath();let n=0;for(let i=idx;i<route.pts.length&&route.cum[i]-route.cum[idx]<650;i++){const p=P(route.pts[i]);n++?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1])}
 cx.shadowColor='#37f2ff';cx.shadowBlur=26;cx.strokeStyle='#37f2ff';cx.lineWidth=H*.022;cx.stroke();cx.shadowBlur=0;cx.strokeStyle='#e8ffff';cx.lineWidth=H*.007;cx.stroke();
 const nx=route.steps.find(s=>s.i>idx);if(nx){const p=P(route.pts[nx.i]);cx.fillStyle='#fff';cx.beginPath();cx.arc(p[0],p[1],H*.017,0,7);cx.fill()}
 cx.save();cx.translate(X,Y);cx.fillStyle='#ff7a3c';cx.shadowColor='#ff7a3c';cx.shadowBlur=18;cx.beginPath();cx.moveTo(0,-H*.04);cx.lineTo(H*.026,H*.022);cx.lineTo(0,H*.008);cx.lineTo(-H*.026,H*.022);cx.fill();cx.restore()}
addEventListener('resize',()=>{if($('#hud').style.display==='block'){size();draw()}});

/* رویدادها */
$('#go').onclick=()=>startNav(false);$('#simB').onclick=()=>startNav(true);$('#xB').onclick=stopNav;
$('#hB').onclick=()=>hud(true);$('#hX').onclick=()=>hud(false);$('#mir').onclick=()=>{const f=$('#hudView').classList.toggle('flip');$('#mir').textContent=f?'آینه ✓':'آینه'};
</script>
</body>
</html>
